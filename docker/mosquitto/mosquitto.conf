# ============================================================================
# mosquitto.conf — configuración del broker MQTT dentro de Docker (DESARROLLO)
# Se monta en el contenedor como /mosquitto/config/mosquitto.conf (ver docker-compose.yml).
# El archivo de usuarios (/mosquitto/passwd) NO está en el repositorio: se genera al arrancar
# el contenedor a partir de MQTT_USER y MQTT_PASSWORD del archivo .env.
# ============================================================================

# Abre el puerto MQTT 1883 en todas las interfaces DEL CONTENEDOR (así lo alcanzan los otros contenedores).
# Hacia fuera, docker-compose.yml solo lo publica en 127.0.0.1 (únicamente este equipo).
listener 1883

# Prohíbe conexiones sin usuario y contraseña, incluso en desarrollo.
allow_anonymous false

# Archivo de usuarios y contraseñas (con hash) creado al arrancar el contenedor.
password_file /mosquitto/passwd

# Sin persistencia: al reiniciar el broker no queda nada guardado en disco.
# Así no sobreviven mensajes "retained" viejos (por ejemplo un "en_linea" de un dispositivo que ya no existe).
persistence false

# Envía los registros a la salida estándar para verlos con "docker compose logs mosquitto".
log_dest stdout

# Niveles de registro: errores, advertencias y avisos (sin el ruido de cada mensaje).
log_type error
log_type warning
log_type notice

# Tamaño máximo de un paquete MQTT: 4096 bytes (el backend también valida este mismo límite).
# Reemplaza a "message_size_limit", que Mosquitto marca como obsoleto.
max_packet_size 4096

# Máximo de clientes conectados a la vez; limita el uso de memoria.
max_connections 50

# Máximo de mensajes en cola por cliente desconectado (con sesión persistente).
max_queued_messages 100

# Máximo de mensajes QoS 1/2 enviados sin confirmar por cliente.
max_inflight_messages 10
