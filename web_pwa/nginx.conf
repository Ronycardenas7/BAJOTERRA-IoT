# Configuración de nginx para la web: sirve los archivos estáticos y reenvía /api al backend.

server {
    # Escucha en el puerto 80 del contenedor.
    listen 80;
    # Responde a cualquier nombre de servidor.
    server_name _;

    # Carpeta donde están los archivos compilados.
    root /usr/share/nginx/html;
    # Archivo que se muestra al entrar a "/".
    index index.html;

    # Comprime texto (HTML, CSS, JS, JSON) para enviar menos datos.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad básicas.
    # Impide que el navegador "adivine" tipos de archivo distintos al declarado.
    add_header X-Content-Type-Options "nosniff" always;
    # Impide que la página se incruste dentro de otra (clickjacking).
    add_header X-Frame-Options "DENY" always;
    # No envía la dirección de origen a otros sitios.
    add_header Referrer-Policy "no-referrer" always;

    # Usa el DNS interno de Docker y vuelve a resolver el nombre "backend" cada 10 segundos.
    # Así, si el contenedor del backend se reinicia y cambia de IP, nginx sigue funcionando sin reiniciarse.
    resolver 127.0.0.11 valid=10s;

    # Reenvía la API al backend. Se usa una variable para que nginx resuelva el nombre en cada petición.
    location /api/ {
        # Dirección interna del backend dentro de la red de Docker.
        set $backend http://backend:5000;
        # Envía la petición al backend con la misma ruta original.
        proxy_pass $backend;
        # Pasa el nombre de host original.
        proxy_set_header Host $host;
        # Si el backend no responde en 15 segundos, devuelve un error en vez de esperar sin fin.
        proxy_read_timeout 15s;
    }

    # También reenvía la ruta de salud (útil para comprobar el backend desde la misma dirección).
    location = /salud {
        # Dirección interna del backend.
        set $backend http://backend:5000;
        # Reenvía la petición.
        proxy_pass $backend;
    }

    # Todo lo demás es la aplicación React: si el archivo no existe, devuelve index.html.
    location / {
        # Intenta el archivo pedido; si no existe, entrega la página principal.
        try_files $uri /index.html;
    }

    # Los archivos con huella en el nombre (assets/) nunca cambian: el navegador puede guardarlos un año.
    location /assets/ {
        # Guarda en caché un año.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repite las cabeceras de seguridad (add_header en un bloque reemplaza las del nivel superior).
        add_header X-Content-Type-Options "nosniff" always;
    }
}
