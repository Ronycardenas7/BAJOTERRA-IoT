<!doctype html>
<!-- Página base de la web. Vite inserta aquí el código de React. -->
<!-- Idioma de la página: español (ayuda a lectores de pantalla y traductores). -->
<html lang="es">
  <head>
    <!-- Codificación de caracteres: UTF-8 permite tildes y la letra ñ. -->
    <meta charset="UTF-8" />
    <!-- Hace que la página se adapte al ancho del celular. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Color de la barra del navegador en celulares (coincide con el fondo oscuro). -->
    <meta name="theme-color" content="#06100b" />
    <!-- Descripción breve de la página. -->
    <meta name="description" content="Monitoreo y control de un invernadero con tres zonas de evaluación: árida, húmeda y selvática." />
    <!-- Icono de la pestaña. -->
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <!-- Manifiesto PWA: permite instalar la web como aplicación. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Título de la pestaña del navegador. -->
    <title>BAJOTERRA · Invernadero inteligente</title>
  </head>
  <body>
    <!-- Contenedor donde React dibuja toda la aplicación. -->
    <div id="root"></div>
    <!-- Punto de entrada del código de la web. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
