<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="glow-arida" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cactus-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="cactus-arm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="pot-kraft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Resplandor cálido del desierto -->
  <circle cx="150" cy="145" r="130" fill="url(#glow-arida)"/>

  <!-- Brazo izquierdo del cactus -->
  <path d="M130 150 H100 Q80 150 80 130 V95 Q80 80 95 80 Q110 80 110 95 V125 Q110 135 125 135 H130" fill="url(#cactus-arm)"/>
  <!-- Brazo derecho del cactus -->
  <path d="M170 135 H195 Q220 135 220 115 V80 Q220 65 205 65 Q190 65 190 80 V110 Q190 120 175 120 H170" fill="url(#cactus-arm)"/>

  <!-- Tronco central del cactus -->
  <rect x="125" y="45" width="50" height="205" rx="25" fill="url(#cactus-body)"/>

  <!-- Costillas y espinas del tronco -->
  <path d="M137 47 V245" stroke="#34d399" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M150 45 V248" stroke="#6ee7b7" stroke-width="2.5" stroke-opacity="0.5"/>
  <path d="M163 47 V245" stroke="#047857" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Espinitas características -->
  <path d="M125 70 L118 68 M125 105 L118 103 M125 140 L118 138 M125 180 L118 178" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M175 60 L182 58 M175 95 L182 93 M175 130 L182 128 M175 170 L182 168" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M80 100 L73 98 M110 100 L117 98 M220 85 L227 83 M190 85 L183 83" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Pequeña flor del desierto en la cúspide -->
  <circle cx="150" cy="45" r="9" fill="#f43f5e"/>
  <circle cx="150" cy="45" r="4" fill="#fbbf24"/>

  <!-- Maceta artesanal kraft/arcilla -->
  <ellipse cx="150" cy="245" rx="54" ry="12" fill="#b45309"/>
  <path d="M100 245 L112 325 Q150 338 188 325 L200 245 Z" fill="url(#pot-kraft)"/>
  <ellipse cx="150" cy="245" rx="50" ry="10" fill="#451a03"/>
  <!-- Línea decorativa ámbar -->
  <path d="M111 285 Q150 295 189 285" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.85"/>
</svg>
