<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" width="100%" height="100%">
  <!-- Fondo técnico oscuro sutil -->
  <rect width="240" height="240" rx="16" fill="#0C1D13" />
  
  <!-- Tanque / Depósito de agua cilíndrico -->
  <!-- Estructura del cuerpo -->
  <rect x="55" y="60" width="130" height="135" rx="14" fill="#132B1E" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2" />
  
  <!-- Tapa superior del depósito -->
  <ellipse cx="120" cy="60" rx="65" ry="14" fill="#1D3E2C" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="2" />
  
  <!-- Nivel de agua interior (Azul agua + Lima) -->
  <path d="M 57 115 Q 85 110 120 115 T 183 115 L 183 180 Q 183 193 170 193 L 70 193 Q 57 193 57 180 Z" fill="#0284C7" fill-opacity="0.35" />
  <path d="M 57 115 Q 85 110 120 115 T 183 115" stroke="#38BDF8" stroke-width="2" fill="none" />
  
  <!-- Escala graduada de nivel de litros (L) -->
  <line x1="70" y1="85" x2="82" y2="85" stroke="#94A3B8" stroke-width="1.5" />
  <text x="88" y="88" fill="#94A3B8" font-family="monospace" font-size="8">50L</text>
  
  <line x1="70" y1="115" x2="82" y2="115" stroke="#38BDF8" stroke-width="1.5" />
  <text x="88" y="118" fill="#38BDF8" font-family="monospace" font-size="8">35L</text>
  
  <line x1="70" y1="145" x2="82" y2="145" stroke="#94A3B8" stroke-width="1.5" />
  <text x="88" y="148" fill="#94A3B8" font-family="monospace" font-size="8">20L</text>
  
  <!-- Mini-Bomba sumergible 5V en el fondo -->
  <rect x="105" y="155" width="30" height="28" rx="4" fill="#0F172A" stroke="#B6E33D" stroke-width="1.5" />
  <!-- Boquilla y manguera de salida hacia arriba -->
  <path d="M 120 155 L 120 40 L 150 40" stroke="#B6E33D" stroke-width="3" stroke-linecap="round" fill="none" />
  
  <!-- Flotador / Sensor de nivel ultrasónico/boya -->
  <circle cx="150" cy="115" r="7" fill="#F59E0B" stroke="#D97706" stroke-width="1" />
  <line x1="150" y1="60" x2="150" y2="108" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="2,2" />
  
  <!-- Gotas de agua y micro-riego -->
  <circle cx="155" cy="40" r="3" fill="#38BDF8" />
  <circle cx="165" cy="48" r="2.5" fill="#38BDF8" />
  
  <!-- Rótulo del depósito -->
  <rect x="80" y="202" width="80" height="18" rx="4" fill="#08140D" stroke="#B6E33D" stroke-opacity="0.4" stroke-width="1" />
  <text x="120" y="214" fill="#B6E33D" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">SISTEMA HÍDRICO</text>
</svg>
