<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" width="100%" height="100%">
  <!-- Fondo técnico -->
  <rect width="320" height="240" rx="16" fill="#080C0A" />
  <rect x="1" y="1" width="318" height="238" rx="15" stroke="#10B981" stroke-opacity="0.2" stroke-width="2" />

  <!-- Cuerpo plástico blanco / gris claro del DHT22 (AM2302) -->
  <rect x="100" y="35" width="120" height="130" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" />

  <!-- Rejilla de ventilación ranurada (característica frontal del DHT22) -->
  <g fill="#94A3B8">
    <!-- Columna 1 -->
    <rect x="114" y="50" width="12" height="6" rx="2" />
    <rect x="114" y="62" width="12" height="6" rx="2" />
    <rect x="114" y="74" width="12" height="6" rx="2" />
    <rect x="114" y="86" width="12" height="6" rx="2" />
    <rect x="114" y="98" width="12" height="6" rx="2" />

    <!-- Columna 2 -->
    <rect x="134" y="50" width="12" height="6" rx="2" />
    <rect x="134" y="62" width="12" height="6" rx="2" />
    <rect x="134" y="74" width="12" height="6" rx="2" />
    <rect x="134" y="86" width="12" height="6" rx="2" />
    <rect x="134" y="98" width="12" height="6" rx="2" />

    <!-- Columna 3 -->
    <rect x="154" y="50" width="12" height="6" rx="2" />
    <rect x="154" y="62" width="12" height="6" rx="2" />
    <rect x="154" y="74" width="12" height="6" rx="2" />
    <rect x="154" y="86" width="12" height="6" rx="2" />
    <rect x="154" y="98" width="12" height="6" rx="2" />

    <!-- Columna 4 -->
    <rect x="174" y="50" width="12" height="6" rx="2" />
    <rect x="174" y="62" width="12" height="6" rx="2" />
    <rect x="174" y="74" width="12" height="6" rx="2" />
    <rect x="174" y="86" width="12" height="6" rx="2" />
    <rect x="174" y="98" width="12" height="6" rx="2" />

    <!-- Columna 5 -->
    <rect x="194" y="50" width="12" height="6" rx="2" />
    <rect x="194" y="62" width="12" height="6" rx="2" />
    <rect x="194" y="74" width="12" height="6" rx="2" />
    <rect x="194" y="86" width="12" height="6" rx="2" />
    <rect x="194" y="98" width="12" height="6" rx="2" />
  </g>

  <!-- Serigrafía del sensor -->
  <text x="160" y="125" fill="#475569" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DHT22 / AM2302</text>
  <text x="160" y="140" fill="#64748B" font-family="sans-serif" font-size="8" text-anchor="middle">DIGITAL HUM &amp; TEMP</text>
  <text x="160" y="152" fill="#10B981" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">±0.5°C · ±2% HR</text>

  <!-- 4 Pines metálicos inferiores -->
  <g fill="#CBD5E1" stroke="#64748B" stroke-width="1">
    <!-- Pin 1: VCC -->
    <rect x="122" y="165" width="6" height="42" rx="1" />
    <!-- Pin 2: DATA (GPIO 4) -->
    <rect x="144" y="165" width="6" height="42" rx="1" fill="#10B981" fill-opacity="0.8" />
    <!-- Pin 3: NC -->
    <rect x="168" y="165" width="6" height="42" rx="1" />
    <!-- Pin 4: GND -->
    <rect x="192" y="165" width="6" height="42" rx="1" />
  </g>

  <!-- Etiquetas de pines -->
  <text x="125" y="220" fill="#EF4444" font-family="monospace" font-size="7" text-anchor="middle">VCC</text>
  <text x="147" y="220" fill="#10B981" font-family="monospace" font-size="7" text-anchor="middle">DATA</text>
  <text x="171" y="220" fill="#64748B" font-family="monospace" font-size="7" text-anchor="middle">NC</text>
  <text x="195" y="220" fill="#94A3B8" font-family="monospace" font-size="7" text-anchor="middle">GND</text>
</svg>
