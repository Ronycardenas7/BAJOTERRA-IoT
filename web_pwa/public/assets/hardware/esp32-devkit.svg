<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" width="100%" height="100%">
  <!-- Fondo con degradado sutil técnico -->
  <rect width="320" height="240" rx="16" fill="#080C0A" />
  <rect x="1" y="1" width="318" height="238" rx="15" stroke="#10B981" stroke-opacity="0.2" stroke-width="2" />
  
  <!-- Placa PCB negra / verde muy oscuro -->
  <rect x="70" y="30" width="180" height="180" rx="8" fill="#0B1310" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Conector Micro-USB superior -->
  <rect x="140" y="24" width="40" height="18" rx="3" fill="#1F2937" stroke="#4B5563" stroke-width="1.5" />
  <rect x="148" y="28" width="24" height="8" rx="2" fill="#111827" />

  <!-- Pines laterales (Cabezales GPIO) -->
  <g fill="#D1D5DB" stroke="#9CA3AF" stroke-width="0.5">
    <!-- Fila izquierda -->
    <rect x="76" y="50" width="8" height="8" rx="1" fill="#F59E0B" fill-opacity="0.8" />
    <rect x="76" y="64" width="8" height="8" rx="1" />
    <rect x="76" y="78" width="8" height="8" rx="1" />
    <rect x="76" y="92" width="8" height="8" rx="1" />
    <rect x="76" y="106" width="8" height="8" rx="1" />
    <rect x="76" y="120" width="8" height="8" rx="1" />
    <rect x="76" y="134" width="8" height="8" rx="1" />
    <rect x="76" y="148" width="8" height="8" rx="1" fill="#10B981" fill-opacity="0.8" />
    <rect x="76" y="162" width="8" height="8" rx="1" fill="#EF4444" fill-opacity="0.8" />
    <rect x="76" y="176" width="8" height="8" rx="1" fill="#3B82F6" fill-opacity="0.8" />

    <!-- Fila derecha -->
    <rect x="236" y="50" width="8" height="8" rx="1" fill="#F59E0B" fill-opacity="0.8" />
    <rect x="236" y="64" width="8" height="8" rx="1" />
    <rect x="236" y="78" width="8" height="8" rx="1" />
    <rect x="236" y="92" width="8" height="8" rx="1" />
    <rect x="236" y="106" width="8" height="8" rx="1" />
    <rect x="236" y="120" width="8" height="8" rx="1" />
    <rect x="236" y="134" width="8" height="8" rx="1" />
    <rect x="236" y="148" width="8" height="8" rx="1" />
    <rect x="236" y="162" width="8" height="8" rx="1" fill="#10B981" fill-opacity="0.8" />
    <rect x="236" y="176" width="8" height="8" rx="1" fill="#EF4444" fill-opacity="0.8" />
  </g>

  <!-- Módulo metálico blindado ESP-WROOM-32 -->
  <rect x="105" y="80" width="110" height="95" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
  <text x="160" y="112" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ESP-WROOM-32</text>
  <text x="160" y="128" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="middle">DUAL CORE 240MHz</text>
  <text x="160" y="140" fill="#10B981" font-family="monospace" font-size="8" text-anchor="middle">ESP-NOW + Wi-Fi</text>

  <!-- Antena PCB trazada en cobre dorado -->
  <path d="M 120 54 L 200 54 L 200 68 L 190 68 L 190 60 L 175 60 L 175 68 L 165 68 L 165 60 L 150 60 L 150 68 L 140 68 L 140 60 L 120 60 Z" fill="#D97706" />

  <!-- Botones EN y BOOT -->
  <rect x="96" y="185" width="16" height="12" rx="2" fill="#374151" stroke="#6B7280" />
  <circle cx="104" cy="191" r="3" fill="#D1D5DB" />
  <text x="104" y="206" fill="#9CA3AF" font-family="sans-serif" font-size="6" text-anchor="middle">EN</text>

  <rect x="208" y="185" width="16" height="12" rx="2" fill="#374151" stroke="#6B7280" />
  <circle cx="216" cy="191" r="3" fill="#D1D5DB" />
  <text x="216" y="206" fill="#9CA3AF" font-family="sans-serif" font-size="6" text-anchor="middle">BOOT</text>

  <!-- LED indicador de encendido y estado -->
  <circle cx="120" cy="190" r="3" fill="#EF4444" />
  <circle cx="120" cy="190" r="6" fill="#EF4444" fill-opacity="0.3" />
  <circle cx="200" cy="190" r="3" fill="#3B82F6" />
  <circle cx="200" cy="190" r="6" fill="#3B82F6" fill-opacity="0.3" />
</svg>
