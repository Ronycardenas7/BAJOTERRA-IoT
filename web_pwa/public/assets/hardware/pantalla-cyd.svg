<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" width="100%" height="100%">
  <!-- Fondo técnico -->
  <rect width="320" height="240" rx="16" fill="#080C0A" />
  <rect x="1" y="1" width="318" height="238" rx="15" stroke="#10B981" stroke-opacity="0.2" stroke-width="2" />

  <!-- PCB amarillo característico de CYD (Cheap Yellow Display) -->
  <rect x="50" y="25" width="220" height="190" rx="10" fill="#D97706" fill-opacity="0.9" stroke="#B45309" stroke-width="2" />

  <!-- Bisel metálico de la pantalla TFT 2.8" -->
  <rect x="65" y="38" width="190" height="145" rx="4" fill="#1F2937" stroke="#374151" stroke-width="2" />

  <!-- Pantalla LCD activa con interfaz gráfica de BAJOTERRA -->
  <rect x="70" y="43" width="180" height="135" rx="2" fill="#050A08" />

  <!-- Barra superior del LCD -->
  <rect x="70" y="43" width="180" height="22" fill="#0F172A" />
  <text x="78" y="58" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="bold">BAJOTERRA HMI v3.0</text>
  <circle cx="236" cy="54" r="3" fill="#10B981" />
  <text x="226" y="57" fill="#64748B" font-family="monospace" font-size="7" text-anchor="end">UART ON</text>

  <!-- 3 Columnas de microclimas en la pantalla táctil -->
  <!-- Selvática -->
  <rect x="75" y="70" width="54" height="60" rx="3" fill="#062217" stroke="#10B981" stroke-width="0.8" />
  <text x="102" y="82" fill="#10B981" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">SELVATICA</text>
  <text x="102" y="96" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">24.2°C</text>
  <text x="102" y="108" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="middle">78% HR</text>
  <text x="102" y="122" fill="#34D399" font-family="sans-serif" font-size="7" text-anchor="middle">VENT: ON</text>

  <!-- Húmeda -->
  <rect x="133" y="70" width="54" height="60" rx="3" fill="#172608" stroke="#84CC16" stroke-width="0.8" />
  <text x="160" y="82" fill="#84CC16" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">HUMEDA</text>
  <text x="160" y="96" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">22.8°C</text>
  <text x="160" y="108" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="middle">85% HR</text>
  <text x="160" y="122" fill="#A3E635" font-family="sans-serif" font-size="7" text-anchor="middle">RIEGO: OK</text>

  <!-- Árida -->
  <rect x="191" y="70" width="54" height="60" rx="3" fill="#291805" stroke="#F59E0B" stroke-width="0.8" />
  <text x="218" y="82" fill="#F59E0B" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">ARIDA</text>
  <text x="218" y="96" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">28.5°C</text>
  <text x="218" y="108" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="middle">32% HR</text>
  <text x="218" y="122" fill="#FBBF24" font-family="sans-serif" font-size="7" text-anchor="middle">SECO</text>

  <!-- Botones táctiles virtuales en la parte inferior del display -->
  <rect x="75" y="136" width="80" height="22" rx="3" fill="#1E293B" stroke="#475569" stroke-width="0.8" />
  <text x="115" y="151" fill="#E2E8F0" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">MODO MANUAL</text>

  <rect x="165" y="136" width="80" height="22" rx="3" fill="#047857" stroke="#10B981" stroke-width="0.8" />
  <text x="205" y="151" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">AUTO PI</text>

  <!-- Conectores y pines UART inferiores (IO22 RX / IO27 TX) -->
  <rect x="115" y="190" width="90" height="16" rx="3" fill="#1F2937" stroke="#4B5563" />
  <circle cx="130" cy="198" r="3" fill="#E5E7EB" />
  <circle cx="145" cy="198" r="3" fill="#E5E7EB" />
  <circle cx="160" cy="198" r="3" fill="#10B981" />
  <circle cx="175" cy="198" r="3" fill="#3B82F6" />
  <circle cx="190" cy="198" r="3" fill="#E5E7EB" />
  <text x="160" y="220" fill="#94A3B8" font-family="sans-serif" font-size="7" text-anchor="middle">UART RX/TX (IO22 / IO27)</text>
</svg>
