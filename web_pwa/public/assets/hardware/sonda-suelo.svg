<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" width="100%" height="100%">
  <!-- Fondo técnico -->
  <rect width="320" height="240" rx="16" fill="#080C0A" />
  <rect x="1" y="1" width="318" height="238" rx="15" stroke="#10B981" stroke-opacity="0.2" stroke-width="2" />

  <!-- Cabezal superior de conexión (PCB negra) -->
  <rect x="110" y="25" width="100" height="55" rx="6" fill="#0B1310" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Conector de cables (VCC controlado por GPIO 25, GND, AOUT GPIO 34) -->
  <rect x="130" y="20" width="60" height="15" rx="3" fill="#1F2937" stroke="#4B5563" />
  <circle cx="142" cy="27" r="3" fill="#10B981" />
  <circle cx="160" cy="27" r="3" fill="#3B82F6" />
  <circle cx="178" cy="27" r="3" fill="#EF4444" />

  <!-- Chip comparador / acondicionador de señal en el cabezal -->
  <rect x="135" y="44" width="50" height="24" rx="3" fill="#1E293B" stroke="#475569" />
  <text x="160" y="59" fill="#10B981" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">SOIL-PROBE</text>

  <!-- Puntas / horquillas de la sonda que penetran en el sustrato (lanzas de medición) -->
  <!-- Punta izquierda -->
  <path d="M 125 80 L 125 195 L 138 215 L 145 195 L 145 80 Z" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <!-- Pista conductora dorada anticorrosión izquierda -->
  <path d="M 130 90 L 130 190 L 138 202 L 140 190 L 140 90 Z" fill="#D97706" />

  <!-- Punta derecha -->
  <path d="M 175 80 L 175 195 L 182 215 L 195 195 L 195 80 Z" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <!-- Pista conductora dorada anticorrosión derecha -->
  <path d="M 180 90 L 180 190 L 182 202 L 190 190 L 190 90 Z" fill="#D97706" />

  <!-- Indicador técnico: energizado solo al medir para prevenir electrólisis -->
  <rect x="30" y="105" width="80" height="35" rx="4" fill="#061A12" stroke="#10B981" stroke-width="0.8" />
  <text x="70" y="120" fill="#10B981" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">ANTI-ELECTRÓLISIS</text>
  <text x="70" y="132" fill="#94A3B8" font-family="monospace" font-size="7" text-anchor="middle">VCC vía GPIO 25</text>

  <rect x="210" y="105" width="80" height="35" rx="4" fill="#061A12" stroke="#10B981" stroke-width="0.8" />
  <text x="250" y="120" fill="#10B981" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">LECTURA ADC</text>
  <text x="250" y="132" fill="#94A3B8" font-family="monospace" font-size="7" text-anchor="middle">Analog GPIO 34</text>
</svg>
